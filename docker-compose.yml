version: '3.8'

services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=library_db
      - DB_PORT=5432
      - PORT=3000
    depends_on:
      - db
    volumes:
      - ./src:/app/src

  db:
    image: postgres:15-alpine
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=library_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # The init.sql file will be executed when the container starts for the first time
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
